name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Release IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          elif [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: App icon
        run: python3 scripts/make_icon.py

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/PiliPlus.app"
          test -d "$APP"
          # Ad-hoc signature, same idea as upstream PiliPlus: AltStore / SideStore / Sideloadly / TrollStore can resign it.
          codesign --force --deep --sign - "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/PiliPlus.app
          zip -r -y PiliPlus.ipa Payload
          ls -lh PiliPlus.ipa
          unzip -t PiliPlus.ipa

      - name: Publish GitHub Release
        if: github.ref == 'refs/tags/v2.0.1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: PiliPlus 2.0.1
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            2.0.1 在 2.0.0 的液态玻璃界面上补齐了日常使用的功能。只包含 iPhone，没有 iPad。

            ## 这次加上的

            - 登录：扫码和 Cookie 写入钥匙串
            - 播放：DASH、弹幕、时间同步，以及接近 YouTube 的播放控制
            - 首页：真实推荐、分区和番剧
            - 历史、稍后再看、收藏、最近点赞和最近投币
            - 关注动态、评论和分类搜索
            - 用户空间
            - 直播间播放，以及分区、搜索、高能榜、醒目留言和表情
            - 空降助手（SponsorBlock）
            - 离线缓存
            - 私信和通知
            - 播放续播、自动连播、章节和定时关闭
            - 发布动态、话题和投票
            - 设置项接通：过滤、屏蔽、主题、标签页和字号
            - 每周必看和入站必刷
            - 收藏夹多选、订阅和资料库搜索
            - 账号管理
            - 专栏、音频、课堂和其他公开内容页
            - 分享海报、局域网投屏、WebDAV 备份与恢复设置、对照 GitHub Releases 的更新检查

            需要登录的功能仍应在真机上用真实账号再确认一次。模拟器里登录态接口经常被风控拦住。

            ## 安装

            这是未签名的 iphoneos 包，不是 App Store 包。GitHub Actions（`macos-26`）用临时签名打包，便于 AltStore、SideStore、Sideloadly 或巨魔（TrollStore）重签后安装。需要 iOS 26，仅 iPhone。
          files: PiliPlus.ipa
