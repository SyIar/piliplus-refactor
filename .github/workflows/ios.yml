name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Release IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          elif [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: App icon
        run: python3 scripts/make_icon.py

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/PiliPlus.app"
          test -d "$APP"
          # Ad-hoc signature, same idea as upstream PiliPlus: AltStore / SideStore / Sideloadly / TrollStore can resign it.
          codesign --force --deep --sign - "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/PiliPlus.app
          zip -r -y PiliPlus.ipa Payload
          ls -lh PiliPlus.ipa
          unzip -t PiliPlus.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: PiliPlus iOS
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            公开 GitHub Actions 构建的 IPA（`macos-26`，iphoneos，无 Apple 开发者证书）。

            这是可重签的安装包，不是 App Store 包。用 AltStore、SideStore、Sideloadly 或巨魔（TrollStore）签名后安装。

            之后每次推到 `main` 都会重新构建，并覆盖本 Release 里的 `PiliPlus.ipa`。
          files: PiliPlus.ipa
