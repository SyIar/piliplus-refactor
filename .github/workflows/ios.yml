name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Release IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          elif [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: App icon
        run: python3 scripts/make_icon.py

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/PiliPlus.app"
          test -d "$APP"
          # Ad-hoc signature, same idea as upstream PiliPlus: AltStore / SideStore / Sideloadly / TrollStore can resign it.
          codesign --force --deep --sign - "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/PiliPlus.app
          zip -r -y PiliPlus.ipa Payload
          ls -lh PiliPlus.ipa
          unzip -t PiliPlus.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: PiliPlus 2.0.0
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            iPhone 原生液态玻璃界面（iOS 26）。只包含 iPhone，没有 iPad。

            ## 界面

            底栏改为系统 `TabView`，并带搜索角色标签。每个标签自带 `NavigationStack`。首页、动态、我的使用系统导航栏和工具栏（`ToolbarItem` / `ToolbarSpacer`）。搜索使用系统 `.searchable`。滚动内容去掉自绘玻璃和渐变背景，玻璃只留在系统栏、表单和播放控件上。播放控制条用 `GlassEffectContainer` 与 `glassEffectID` 形变，圆角用 `ConcentricRectangle`。列表和半屏表使用系统背景与 detent。

            ## 性能

            公开 macOS 运行器上的 iPhone 17 Pro 模拟器、iOS 26.5、Release、60 Hz。镜像里没有 iPhone 18 Pro。数字相对上一轮滚动优化（`86aceb6`）。

            冷启动中位：进程 1144 ms，首帧 809 ms（上一轮 1502 ms / 969 ms）。

            首页滚动，冷 / 热：平均 18.85 / 17.21 ms，p95 33.66 / 16.67 ms，p99 48.89 / 33.33 ms，最大 100.37 / 49.87 ms。封面在扫动期间没有解码未命中。

            又试过把分类条改成固定安全区，避免第一次钉住和卡片滑到导航栏下。热扫动尾部略好，冷扫动 p95 / p99 变差，静止截图无差别，因此没有保留。

            ## 安装

            这是未签名的 iphoneos 包，不是 App Store 包。GitHub Actions（`macos-26`）用临时签名打包，便于 AltStore、SideStore、Sideloadly 或巨魔（TrollStore）重签后安装。需要 iOS 26，仅 iPhone。
          files: PiliPlus.ipa
